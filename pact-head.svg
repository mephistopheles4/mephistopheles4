<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 216" width="888" height="216" role="img" aria-label="The Pact">
  <style>
    @font-face{font-family:'Plex Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Archivo Display';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
    :root{--paper:#f4f6f7;--ink:#15222c;--ink70:rgb(21 34 44/.7);--ink30:rgb(21 34 44/.3);--structure:#1d5c8c}
    @media (prefers-color-scheme:dark){:root{--paper:#1a1614;--ink:#ece5df;--ink70:rgb(236 229 223/.7);--ink30:rgb(236 229 223/.28);--structure:#6fa9d1}}
    text{font-family:'Plex Mono',ui-monospace,monospace;fill:var(--ink);text-anchor:middle}
    .disp{font-family:'Archivo Display','Archivo',system-ui,sans-serif}
  </style>
  <rect width="888" height="216" fill="var(--paper)"/>
  <rect x="8.5" y="8.5" width="871" height="199" fill="none" stroke="var(--ink30)"/>
  <rect x="24" y="24" width="840" height="168" fill="none" stroke="var(--ink)" stroke-width="2"/>

  <text x="444" y="60" font-size="11" letter-spacing="3" style="fill:var(--structure)">INSTRUMENT OF AGREEMENT · NO. 0004</text>
  <text x="444" y="122" class="disp" font-size="56" letter-spacing="2.2">THE PACT</text>
  <path d="M324 140.5H564" stroke="var(--ink)"/>
  <text x="444" y="164" font-size="13" style="fill:var(--ink70)">Terms under which machines work beside me.</text>
</svg>
