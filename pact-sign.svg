<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 168" width="888" height="168" role="img" aria-label="Signatures">
  <style>
    @font-face{font-family:'Plex Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Plex Mono';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
    :root{--paper:#f4f6f7;--ink:#15222c;--ink70:rgb(21 34 44/.7);--ink30:rgb(21 34 44/.3);--structure:#1d5c8c}
    @media (prefers-color-scheme:dark){:root{--paper:#1a1614;--ink:#ece5df;--ink70:rgb(236 229 223/.7);--ink30:rgb(236 229 223/.28);--structure:#6fa9d1}}
    text{font-family:'Plex Mono',ui-monospace,monospace;fill:var(--ink)}
    .lbl{font-size:11px;letter-spacing:2px;fill:var(--structure)}
    .cap{font-size:11px;fill:var(--ink70)}
  </style>
  <rect width="888" height="168" fill="var(--paper)"/>
  <rect x="24" y="24" width="840" height="120" fill="none" stroke="var(--ink)" stroke-width="2"/>

  <text x="48" y="56" class="lbl">THE ARCHITECT</text>
  <text x="48" y="96" font-size="20" font-weight="600">/s/ Ayman Diab</text>
  <path d="M48 108.5H408" stroke="var(--ink)"/>
  <text x="48" y="128" class="cap">Human. States intent. Holds no bypass.</text>

  <text x="480" y="56" class="lbl">THE FAMILIAR</text>
  <text x="480" y="96" font-size="14">Co-Authored-By: &lt;agent&gt;</text>
  <path d="M480 108.5H840" stroke="var(--ink)"/>
  <text x="480" y="128" class="cap">Countersigns every commit it touches.</text>
</svg>
